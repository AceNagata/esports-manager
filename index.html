<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esports Manager</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/control.css">
<style>
  main { max-width: 820px; padding-top: 60px; }
  .hero { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
  .hero .brand-logo { width: 72px; height: 72px; font-size: 72px; }
  .hero h1 { font: 800 40px/1 var(--display); text-transform: uppercase; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item .col b { font: 700 18px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; }
  .item code { font-size: 12px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="hero" id="hero"></div>
  <div class="card">
    <div class="item">
      <div class="col"><b>Control panel</b><span class="hint">Open on the producer's laptop, tablet or phone.</span></div>
      <a class="btn pri big" href="control/">Open control</a>
    </div>
    <div id="outs"></div>
  </div>
  <p class="hint" style="margin-top:16px">Add each output as a vMix <b>Web Browser</b> input at 1920×1080. Setup steps are in README.md.</p>
</main>
<script type="module">
  import { CONFIG } from './assets/js/config.js';
  import { applyTheme, brandLogoHTML, esc } from './assets/js/common.js';
  applyTheme();
  document.getElementById('hero').innerHTML = `${brandLogoHTML()}<div><h1>${esc(CONFIG.tournament.name)}</h1><div class="hint">ESPORTS MANAGER · ${esc(CONFIG.tournament.season)}</div></div>`;
  const outs = [
    ['vMix input 1: Scenes', 'Holding, countdown, pauses, intro, veto, bracket, schedule, standings, winner', 'output/scene.html'],
    ['vMix input 2: In-game overlay', 'Scorebug, series strip, pause banner, lower third, ticker, sponsor', 'output/overlay.html'],
    ['vMix input 3: Caster frame', '1/2/3-camera frames with nameplates', 'output/cast.html'],
  ];
  document.getElementById('outs').innerHTML = outs.map(([n, d, f]) => {
    const url = new URL(f, location.href).href;
    return `<div class="item"><div class="col"><b>${n}</b><span class="hint">${d}</span><code>${esc(url)}</code></div>
      <button class="btn" onclick="navigator.clipboard.writeText('${url}');this.textContent='Copied'">Copy URL</button>
      <a class="btn" href="${f}?preview=1" target="_blank">Preview</a></div>`;
  }).join('');
</script>
</body>
</html>
